[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talkrobo"
version = "0.1.0"
description = "子供向け 会話できる人形ロボット (Claude API + ローカルSTT/TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 音声入出力 (--mock / 実機で必要)
audio = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "faster-whisper>=1.0",
]
# Raspberry Pi 実機
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2",
    "adafruit-circuitpython-neopixel>=6.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
talkrobo = "talkrobo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
